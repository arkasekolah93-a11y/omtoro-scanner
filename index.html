<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Om Toro Scanner</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Libraries: jsPDF, Tesseract (OCR), LocalForage, dan penambahan Cropper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root { --bg-color: #0a192f; --accent-color: #ff9f1c; --text-light: #e6f1ff; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: var(--text-light); overflow: hidden; width: 100vw; height: 100vh; position: relative; }
        
        header { position: absolute; top: 0; width: 100%; padding: 15px 0; text-align: center; background: linear-gradient(#0a192f, transparent); z-index: 10; transition: all 0.3s; }
        header h2 { margin: 0; color: var(--accent-color); font-size: 18px; letter-spacing: 1px; }
        
        #camera-container { width: 100%; height: 100%; position: absolute; top: 0; z-index: 1; }
        /* Object-fit cover memastikan kamera selalu full screen baik portrait maupun landscape */
        video { width: 100%; height: 100%; object-fit: cover; } 
        
        /* Bingkai Kamera (Panduan Visual Saja) */
        #document-frame {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75%; height: 70%; border: 2px dashed rgba(255, 159, 28, 0.5);
            box-shadow: 0 0 0 2000px rgba(10, 25, 47, 0.6); z-index: 5; pointer-events: none;
        }

        .controls-overlay {
            position: absolute; bottom: 0; width: 100%; padding: 15px;
            background: linear-gradient(transparent, var(--bg-color) 40%);
            z-index: 10; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }

        .status-bar { font-size: 13px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 15px; margin-bottom: 10px; text-align: center; width: auto;}
        
        .btn-row { display: flex; gap: 8px; margin-bottom: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        button { border: none; border-radius: 8px; padding: 10px 12px; font-weight: bold; cursor: pointer; color: var(--text-light); background: rgba(255,255,255,0.15); transition: 0.2s; font-size: 13px;}
        button:active { transform: scale(0.95); }
        
        .btn-capture { background: var(--accent-color); width: 65px; height: 65px; border-radius: 50%; border: 4px solid #fff; flex-shrink: 0; }
        .btn-action-gas { background: #2563eb; } /* Biru untuk GAS */
        .btn-action-local { background: #16a34a; } /* Hijau untuk Lokal */

        /* --- UI CROP / EDIT --- */
        #crop-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 50; flex-direction: column; }
        #image-to-crop { max-width: 100%; max-height: 80vh; display: block; }
        .crop-controls { height: 20vh; display: flex; justify-content: space-around; align-items: center; background: var(--bg-color); padding: 0 20px; }
        .crop-controls button { padding: 15px 30px; font-size: 16px; }

        /* --- UI MODAL PENGATURAN --- */
        #settings-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-color); border: 2px solid var(--accent-color); padding: 20px; border-radius: 10px; z-index: 100; width: 80%; max-width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 99; }
        .setting-item { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px;}
        
        /* Toggle Switch CSS */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        #preview-canvas { display: none; }
    </style>
</head>
<body>

    <!-- Layar Utama Kamera -->
    <div id="camera-screen">
        <header id="app-header"><h2>OM TORO SCANNER</h2></header>
        
        <div id="camera-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="preview-canvas"></canvas>
        </div>
        <div id="document-frame"></div>

        <div class="controls-overlay">
            <div class="status-bar" id="status">Kamera Siap. Letakkan dokumen di dalam bingkai.</div>
            
            <div class="btn-row">
                <button id="settings-btn">⚙️ Pengaturan</button>
                <button id="reset-btn" style="background:#ef4444;">Hapus Data</button>
            </div>

            <div class="btn-row" style="align-items: center; justify-content: center; gap: 20px;">
                <button class="btn-action-local" id="download-local-btn">Simpan Lokal</button>
                <button class="btn-capture" id="capture-btn"></button>
                <button class="btn-action-gas" id="upload-gas-btn">Upload GAS</button>
            </div>
        </div>
    </div>

    <!-- Layar Edit/Crop (Muncul setelah jepret) -->
    <div id="crop-screen">
        <div style="height: 80vh; display: flex; align-items: center; justify-content: center; background: #111;">
            <img id="image-to-crop" src="">
        </div>
        <div class="crop-controls">
            <button id="cancel-crop-btn" style="background: #ef4444;">Ulangi</button>
            <button id="confirm-crop-btn" style="background: var(--accent-color); color: #000;">Gunakan & Lanjut</button>
        </div>
    </div>

    <!-- Modal Pengaturan -->
    <div class="modal-overlay" id="modal-bg"></div>
    <div id="settings-modal">
        <h3 style="margin-top:0; color: var(--accent-color); border-bottom: 1px solid #444; padding-bottom: 10px;">Pengaturan PDF</h3>
        
        <div class="setting-item">
            <span>Filter Hitam Putih (B&W)</span>
            <label class="switch"><input type="checkbox" id="cb-filter" checked><span class="slider"></span></label>
        </div>
        <div class="setting-item">
            <span>Watermark (Om Toro)</span>
            <label class="switch"><input type="checkbox" id="cb-watermark" checked><span class="slider"></span></label>
        </div>
        <div class="setting-item">
            <span>Cetak Timestamp</span>
            <label class="switch"><input type="checkbox" id="cb-time" checked><span class="slider"></span></label>
        </div>
        <div class="setting-item">
            <span>Cetak Lokasi GPS</span>
            <label class="switch"><input type="checkbox" id="cb-gps" checked><span class="slider"></span></label>
        </div>
        
        <button id="close-settings-btn" style="width: 100%; margin-top: 15px; background: var(--accent-color); color: #000;">Tutup</button>
    </div>

    <script>
        // --- KONFIGURASI URL GAS ---
        const GAS_URL = "URL_WEB_APP_GAS_ANDA_DISINI"; 
        
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('preview-canvas');
        const statusText = document.getElementById('status');
        
        let capturedImages = [];
        let cropper;
        let gpsData = { lat: "-", lng: "-" };

        // 1. Dapatkan GPS
        navigator.geolocation.getCurrentPosition(
            p => { gpsData = { lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) }; },
            e => console.log("GPS Belum Aktif")
        );

        // 2. Inisialisasi Kamera (Responsive Landscape/Portrait otomatis dari object-fit CSS)
        async function initCamera() {
            try {
                // Ideal resolusi tinggi
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: {ideal: 1920}, height: {ideal: 1080} } 
                });
                video.srcObject = stream;
            } catch (e) { statusText.innerText = "Error Akses Kamera"; }
        }

        // --- LOGIKA CROP & EDIT ---

        // Jepret -> Masuk Mode Crop
        document.getElementById('capture-btn').addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Tampilkan layar Crop
            document.getElementById('camera-screen').style.display = 'none';
            const cropScreen = document.getElementById('crop-screen');
            cropScreen.style.display = 'flex';
            
            const imageToCrop = document.getElementById('image-to-crop');
            imageToCrop.src = canvas.toDataURL('image/jpeg', 1.0);

            // Hancurkan cropper lama jika ada, buat baru
            if(cropper) cropper.destroy();
            cropper = new Cropper(imageToCrop, {
                viewMode: 1,
                dragMode: 'crop',
                autoCropArea: 0.8, // Otomatis membuat bingkai awal sebesar 80% layar
                restore: false,
                guides: true,
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
            });
        });

        // Batal Crop -> Kembali ke Kamera
        document.getElementById('cancel-crop-btn').addEventListener('click', () => {
            document.getElementById('crop-screen').style.display = 'none';
            document.getElementById('camera-screen').style.display = 'block';
            if(cropper) cropper.destroy();
        });

        // Konfirmasi Crop -> Filter B&W (Jika Aktif) -> Simpan ke Array
        document.getElementById('confirm-crop-btn').addEventListener('click', () => {
            // Dapatkan hasil crop
            const croppedCanvas = cropper.getCroppedCanvas();
            const ctx = croppedCanvas.getContext('2d');
            
            // Cek apakah fitur B&W aktif di pengaturan
            if(document.getElementById('cb-filter').checked) {
                let imgData = ctx.getImageData(0, 0, croppedCanvas.width, croppedCanvas.height);
                let d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    let avg = (d[i] + d[i+1] + d[i+2]) / 3;
                    let c = avg > 110 ? 255 : avg - 60; // Threshold logic
                    d[i] = d[i+1] = d[i+2] = c;
                }
                ctx.putImageData(imgData, 0, 0);
            }

            capturedImages.push(croppedCanvas.toDataURL('image/jpeg', 0.9));
            statusText.innerText = `${capturedImages.length} Halaman Siap.`;
            
            // Kembali ke kamera
            document.getElementById('crop-screen').style.display = 'none';
            document.getElementById('camera-screen').style.display = 'block';
            cropper.destroy();
        });


        // --- LOGIKA PENGATURAN UI ---
        const modal = document.getElementById('settings-modal');
        const modalBg = document.getElementById('modal-bg');
        document.getElementById('settings-btn').addEventListener('click', () => { modal.style.display = 'block'; modalBg.style.display = 'block'; });
        document.getElementById('close-settings-btn').addEventListener('click', () => { modal.style.display = 'none'; modalBg.style.display = 'none'; });
        document.getElementById('reset-btn').addEventListener('click', () => { capturedImages = []; statusText.innerText="Data dihapus. Mulai baru."; });


        // --- LOGIKA PDF GENERATOR (Digunakan Lokal & GAS) ---
        function generatePDFBase64() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF(); // Default A4 Portrait

            capturedImages.forEach((img, i) => {
                if (i > 0) pdf.addPage();
                let w = pdf.internal.pageSize.getWidth();
                let h = pdf.internal.pageSize.getHeight();
                
                pdf.addImage(img, 'JPEG', 0, 0, w, h);
                
                // Cek status toggle
                const useWM = document.getElementById('cb-watermark').checked;
                const useTime = document.getElementById('cb-time').checked;
                const useGPS = document.getElementById('cb-gps').checked;

                if(useWM || useTime || useGPS) {
                    pdf.setTextColor(255, 0, 0); 
                    pdf.setFontSize(10);
                    let yPos = h - 20;

                    if(useWM) {
                        pdf.text("SCANNED BY OM TORO SCANNER", 10, yPos);
                        yPos += 7;
                    }
                    
                    let metaText = "";
                    if(useTime) metaText += `WAKTU: ${new Date().toLocaleString('id-ID')} `;
                    if(useGPS) metaText += `| GPS: ${gpsData.lat}, ${gpsData.lng}`;
                    
                    if(metaText !== "") {
                        pdf.text(metaText, 10, yPos);
                    }
                }
            });
            return pdf;
        }

        // Tombol Download Lokal
        document.getElementById('download-local-btn').addEventListener('click', () => {
            if(capturedImages.length === 0) return alert("Belum ada dokumen yang di-scan!");
            statusText.innerText = "Menyimpan ke perangkat...";
            const pdf = generatePDFBase64();
            pdf.save(`OmToro_Scan_${Date.now()}.pdf`);
            statusText.innerText = "PDF Berhasil Disimpan ke HP!";
            capturedImages = []; // Auto reset
        });

        // Tombol Upload GAS
        document.getElementById('upload-gas-btn').addEventListener('click', async () => {
            if(capturedImages.length === 0) return alert("Belum ada dokumen yang di-scan!");
            statusText.innerText = "Mempersiapkan Upload...";
            
            const pdf = generatePDFBase64();
            const pdfBase64 = pdf.output('datauristring');
            const fileName = `OmToro_GAS_${Date.now()}.pdf`;

            if (navigator.onLine) {
                statusText.innerText = "Mengunggah ke Server Drive...";
                fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ fileName: fileName, base64: pdfBase64 })
                }).then(res => res.json()).then(data => {
                    statusText.innerText = "Berhasil masuk ke Google Drive!";
                    capturedImages = [];
                }).catch(e => {
                    localforage.setItem(fileName, pdfBase64);
                    statusText.innerText = "Gagal upload. Disimpan offline!";
                    capturedImages = [];
                });
            } else {
                localforage.setItem(fileName, pdfBase64);
                statusText.innerText = "Anda Offline. Disimpan di HP sementara.";
                capturedImages = [];
            }
        });

        // Daftarkan Service Worker
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        
        // Mulai aplikasi
        window.onload = initCamera;

        // Auto-refresh ukuran kamera jika HP diputar
        window.addEventListener("orientationchange", function() {
            setTimeout(() => {
                // Object-fit cover CSS sudah menangani rasio, 
                // ini hanya trigger tambahan agar UI tidak nge-glitch
                window.dispatchEvent(new Event('resize'));
            }, 200);
        });
    </script>
</body>
</html>
