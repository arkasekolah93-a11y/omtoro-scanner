<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Om Toro Scanner</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- OpenCV.js untuk Auto-Detect Frame -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>

    <style>
        :root { --bg-color: #0a192f; --accent-color: #ff9f1c; --text-light: #e6f1ff; }
        body { margin: 0; font-family: sans-serif; background: #000; color: var(--text-light); overflow: hidden; width: 100vw; height: 100vh; position: relative; }
        header { position: absolute; top: 0; width: 100%; padding: 15px 0; text-align: center; background: linear-gradient(#0a192f, transparent); z-index: 10; }
        header h2 { margin: 0; color: var(--accent-color); font-size: 18px; letter-spacing: 1px; }
        
        #camera-container { width: 100%; height: 100%; position: absolute; top: 0; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Layer Transparan untuk menggambar bingkai dinamis */
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

        .controls-overlay {
            position: absolute; bottom: 0; width: 100%; padding: 15px;
            background: linear-gradient(transparent, var(--bg-color) 30%);
            z-index: 10; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }

        .status-bar { font-size: 12px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 15px; margin-bottom: 10px; color: var(--accent-color); font-weight: bold;}
        .ocr-result { width: 90%; max-height: 60px; overflow-y: auto; font-size: 11px; background: rgba(255,255,255,0.1); padding: 5px; margin-bottom: 10px; border-radius: 5px; display: none; }

        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        button { border: none; border-radius: 8px; padding: 10px 15px; font-weight: bold; cursor: pointer; color: var(--text-light); background: rgba(255,255,255,0.1); transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-capture { background: var(--accent-color); width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; }
        .btn-action { background: #22c55e; }
        
        #preview-canvas, #hidden-cv-canvas { display: none; }
    </style>
</head>
<body>

    <header><h2>OM TORO SCANNER</h2></header>

    <div id="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <!-- Canvas untuk bingkai dinamis -->
        <canvas id="overlay-canvas"></canvas>
        <!-- Canvas untuk pemrosesan gambar -->
        <canvas id="preview-canvas"></canvas>
        <!-- Canvas tersembunyi untuk proses algoritma OpenCV -->
        <canvas id="hidden-cv-canvas"></canvas>
    </div>

    <div class="controls-overlay">
        <div class="status-bar" id="status">Memuat AI Computer Vision...</div>
        <div class="ocr-result" id="ocr-text"></div>
        
        <div class="btn-row">
            <button id="filter-btn">Filter B&W</button>
            <button id="ocr-btn">Ekstrak Teks (OCR)</button>
        </div>

        <div class="btn-row" style="align-items: center;">
            <button id="reset-btn" style="background:#ef4444;">Reset</button>
            <button class="btn-capture" id="capture-btn"></button>
            <button class="btn-action" id="download-btn">Unduh PDF</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const previewCanvas = document.getElementById('preview-canvas');
        const hiddenCvCanvas = document.getElementById('hidden-cv-canvas');
        const hiddenCvCtx = hiddenCvCanvas.getContext('2d', { willReadFrequently: true });
        
        const statusText = document.getElementById('status');
        const ocrDiv = document.getElementById('ocr-text');
        
        let capturedImages = [];
        let useFilter = true;
        let gpsData = { lat: "-", lng: "-" };
        let openCvReady = false;

        // Inisiasi GPS
        navigator.geolocation.getCurrentPosition(
            p => { gpsData = { lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) }; },
            e => console.log("GPS Off")
        );

        // Inisiasi Kamera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: {ideal: 1920} } });
                video.srcObject = stream;
                
                // Set ukuran overlay canvas sama dengan ukuran layar HP
                video.onloadedmetadata = () => {
                    overlayCanvas.width = video.clientWidth;
                    overlayCanvas.height = video.clientHeight;
                };
            } catch (e) { statusText.innerText = "Error Akses Kamera"; }
        }

        // Fungsi yang dipanggil otomatis saat OpenCV selesai dimuat
        function onOpenCvReady() {
            openCvReady = true;
            statusText.innerText = "Arahkan Kamera ke Dokumen";
            requestAnimationFrame(processVideoFrame);
        }

        // Proses AI: Mendeteksi tepi dokumen & menggambar bingkai dinamis
        function processVideoFrame() {
            if (!openCvReady || video.paused || video.ended) {
                requestAnimationFrame(processVideoFrame);
                return;
            }

            try {
                // Skala gambar diperkecil agar HP tidak lemot saat memproses video real-time
                const processWidth = 320;
                const processHeight = 240;
                hiddenCvCanvas.width = processWidth;
                hiddenCvCanvas.height = processHeight;
                hiddenCvCtx.drawImage(video, 0, 0, processWidth, processHeight);

                let src = cv.imread(hiddenCvCanvas);
                let gray = new cv.Mat();
                let edges = new cv.Mat();

                // Ubah ke abu-abu lalu deteksi tepian (Edge Detection)
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                cv.Canny(gray, edges, 50, 150, 3, false);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let maxContourIndex = -1;

                // Cari area kotak (dokumen) paling besar di layar
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if (area > 5000) { 
                        let peri = cv.arcLength(cnt, true);
                        let approx = new cv.Mat();
                        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                        
                        // Pastikan bentuknya segi empat (dokumen)
                        if (approx.rows === 4 && area > maxArea) {
                            maxArea = area;
                            maxContourIndex = i;
                        }
                        approx.delete();
                    }
                    cnt.delete();
                }

                // Bersihkan layar transparan
                overlayCanvas.width = video.clientWidth;
                overlayCanvas.height = video.clientHeight;
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                // Jika dokumen ditemukan, gambar bingkai dinamis warna oranye
                if (maxContourIndex !== -1) {
                    let cnt = contours.get(maxContourIndex);
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                    // Hitung rasio untuk mengembalikan koordinat ke ukuran layar HP asli
                    let scaleX = overlayCanvas.width / processWidth;
                    let scaleY = overlayCanvas.height / processHeight;

                    overlayCtx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        let x = approx.data32S[i * 2] * scaleX;
                        let y = approx.data32S[i * 2 + 1] * scaleY;
                        if (i === 0) overlayCtx.moveTo(x, y);
                        else overlayCtx.lineTo(x, y);
                    }
                    overlayCtx.closePath();
                    
                    // Desain bingkai dinamis
                    overlayCtx.lineWidth = 4;
                    overlayCtx.strokeStyle = '#ff9f1c'; // Warna Warm Yellow Orange
                    overlayCtx.fillStyle = 'rgba(255, 159, 28, 0.2)'; // Efek highlight tipis di tengah
                    overlayCtx.fill();
                    overlayCtx.stroke();

                    approx.delete();
                }

                // Hapus memori OpenCV agar browser tidak crash
                src.delete(); gray.delete(); edges.delete(); contours.delete(); hierarchy.delete();

            } catch (err) {
                console.log(err);
            }
            // Ulangi terus menerus seperti animasi
            requestAnimationFrame(processVideoFrame);
        }

        // Toggle Filter Hitam Putih
        document.getElementById('filter-btn').addEventListener('click', (e) => {
            useFilter = !useFilter;
            e.target.style.background = useFilter ? "rgba(255,255,255,0.1)" : "#ef4444";
            statusText.innerText = useFilter ? "Filter B&W Aktif" : "Filter Dimatikan";
        });

        function applyFilter(ctx, w, h) {
            let imgData = ctx.getImageData(0, 0, w, h);
            let d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                let avg = (d[i] + d[i+1] + d[i+2]) / 3;
                let c = avg > 110 ? 255 : avg - 60; 
                d[i] = d[i+1] = d[i+2] = c;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Tombol Jepret
        document.getElementById('capture-btn').addEventListener('click', () => {
            const ctx = previewCanvas.getContext('2d');
            previewCanvas.width = video.videoWidth; 
            previewCanvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
            
            if(useFilter) applyFilter(ctx, previewCanvas.width, previewCanvas.height);
            
            capturedImages.push(previewCanvas.toDataURL('image/jpeg', 0.8));
            statusText.innerText = `${capturedImages.length} Halaman Siap.`;
        });

        // Tombol Ekstrak Teks
        document.getElementById('ocr-btn').addEventListener('click', async () => {
            if(capturedImages.length === 0) return alert("Jepret dokumen dulu!");
            statusText.innerText = "Membaca teks dokumen (OCR)...";
            ocrDiv.style.display = "block"; ocrDiv.innerText = "Memproses...";
            
            Tesseract.recognize(capturedImages[capturedImages.length-1], 'ind', { logger: m => console.log(m) })
                .then(({ data: { text } }) => {
                    ocrDiv.innerText = text;
                    statusText.innerText = "OCR Selesai.";
                });
        });

        // Tombol Download Langsung
        document.getElementById('download-btn').addEventListener('click', () => {
            if(capturedImages.length === 0) return alert("Belum ada dokumen!");
            statusText.innerText = "Membuat PDF...";

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            const timestamp = new Date().toLocaleString('id-ID');

            capturedImages.forEach((img, i) => {
                if (i > 0) pdf.addPage();
                let w = pdf.internal.pageSize.getWidth();
                let h = pdf.internal.pageSize.getHeight();
                pdf.addImage(img, 'JPEG', 0, 0, w, h);
                
                // Watermark Om Toro Scanner
                pdf.setTextColor(255, 0, 0); pdf.setFontSize(10);
                pdf.text("SCANNED BY OM TORO SCANNER", 10, h - 20);
                pdf.text(`WAKTU: ${timestamp} | GPS: ${gpsData.lat}, ${gpsData.lng}`, 10, h - 10);
            });

            pdf.save(`Scan_Om_Toro_${Date.now()}.pdf`);
            capturedImages = []; 
            statusText.innerText = "Berhasil Diunduh!";
        });

        // Tombol Reset
        document.getElementById('reset-btn').addEventListener('click', () => { 
            capturedImages = []; 
            ocrDiv.style.display="none"; 
            statusText.innerText="Data Dihapus."; 
        });

        // Jalankan Kamera Saat Halaman Dibuka
        window.onload = initCamera;
    </script>
</body>
</html>
