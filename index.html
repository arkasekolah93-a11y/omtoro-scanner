<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Om Toro Scanner</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        :root { --bg-color: #0a192f; --accent-color: #ff9f1c; --text-light: #e6f1ff; }
        body { margin: 0; font-family: sans-serif; background: #000; color: var(--text-light); overflow: hidden; width: 100vw; height: 100vh; position: relative; }
        header { position: absolute; top: 0; width: 100%; padding: 15px 0; text-align: center; background: linear-gradient(#0a192f, transparent); z-index: 10; }
        header h2 { margin: 0; color: var(--accent-color); font-size: 18px; letter-spacing: 1px; }
        
        #camera-container { width: 100%; height: 100%; position: absolute; top: 0; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #document-frame {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75vw; height: 60vh; border: 2px solid var(--accent-color);
            box-shadow: 0 0 0 2000px rgba(10, 25, 47, 0.7); z-index: 5; pointer-events: none;
        }

        .controls-overlay {
            position: absolute; bottom: 0; width: 100%; padding: 15px;
            background: linear-gradient(transparent, var(--bg-color) 30%);
            z-index: 10; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }

        .status-bar { font-size: 12px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 15px; margin-bottom: 10px; }
        .ocr-result { width: 90%; max-height: 60px; overflow-y: auto; font-size: 11px; background: rgba(255,255,255,0.1); padding: 5px; margin-bottom: 10px; border-radius: 5px; display: none; }

        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        button { border: none; border-radius: 8px; padding: 10px 15px; font-weight: bold; cursor: pointer; color: var(--text-light); background: rgba(255,255,255,0.1); }
        .btn-capture { background: var(--accent-color); width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; }
        .btn-action { background: #22c55e; }
        
        #preview-canvas { display: none; }
    </style>
</head>
<body>

    <header><h2>OM TORO SCANNER</h2></header>

    <div id="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="preview-canvas"></canvas>
    </div>
    <div id="document-frame"></div>

    <div class="controls-overlay">
        <div class="status-bar" id="status">Menginisialisasi Sistem...</div>
        <div class="ocr-result" id="ocr-text"></div>
        
        <div class="btn-row">
            <button id="filter-btn">Filter B&W</button>
            <button id="ocr-btn">Ekstrak Teks (OCR)</button>
        </div>

        <div class="btn-row" style="align-items: center;">
            <button id="reset-btn" style="background:#ef4444;">Reset</button>
            <button class="btn-capture" id="capture-btn"></button>
            <button class="btn-action" id="upload-btn">Upload GAS</button>
        </div>
    </div>

    <script>
        // PASTIKAN MENGGANTI URL DI BAWAH INI DENGAN URL WEB APP GAS YANG BARU DIDEPLOY
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwOnb9OEESd5roHZRlFchlQSKr1t1MyrQ--K5vqkKVjJH3EvKN2unhU6xfTDlJ4YmibcQ/exec"; 
        
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('preview-canvas');
        const statusText = document.getElementById('status');
        const ocrDiv = document.getElementById('ocr-text');
        
        let capturedImages = [];
        let useFilter = true;
        let gpsData = { lat: "-", lng: "-" };

        navigator.geolocation.getCurrentPosition(
            p => { gpsData = { lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) }; },
            e => console.log("GPS Off")
        );

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: {ideal: 1920} } });
                video.srcObject = stream;
                statusText.innerText = "Sistem Siap. Arahkan Dokumen.";
            } catch (e) { statusText.innerText = "Error Akses Kamera"; }
        }

        document.getElementById('filter-btn').addEventListener('click', (e) => {
            useFilter = !useFilter;
            e.target.style.background = useFilter ? "rgba(255,255,255,0.1)" : "#ef4444";
            statusText.innerText = useFilter ? "Filter B&W Aktif" : "Filter Dimatikan";
        });

        function applyFilter(ctx, w, h) {
            let imgData = ctx.getImageData(0, 0, w, h);
            let d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                let avg = (d[i] + d[i+1] + d[i+2]) / 3;
                let c = avg > 110 ? 255 : avg - 60; 
                d[i] = d[i+1] = d[i+2] = c;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        document.getElementById('capture-btn').addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            if(useFilter) applyFilter(ctx, canvas.width, canvas.height);
            
            capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));
            statusText.innerText = `${capturedImages.length} Halaman Siap.`;
        });

        document.getElementById('ocr-btn').addEventListener('click', async () => {
            if(capturedImages.length === 0) return alert("Jepret dokumen dulu!");
            statusText.innerText = "Membaca teks dokumen (OCR)... Mohon tunggu.";
            ocrDiv.style.display = "block"; ocrDiv.innerText = "Memproses...";
            
            Tesseract.recognize(capturedImages[capturedImages.length-1], 'ind', { logger: m => console.log(m) })
                .then(({ data: { text } }) => {
                    ocrDiv.innerText = text;
                    statusText.innerText = "OCR Selesai.";
                });
        });

        document.getElementById('upload-btn').addEventListener('click', async () => {
            if(capturedImages.length === 0) return alert("Belum ada dokumen!");
            statusText.innerText = "Membuat PDF & Watermark...";

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            const timestamp = new Date().toLocaleString('id-ID');

            capturedImages.forEach((img, i) => {
                if (i > 0) pdf.addPage();
                let w = pdf.internal.pageSize.getWidth();
                let h = pdf.internal.pageSize.getHeight();
                pdf.addImage(img, 'JPEG', 0, 0, w, h);
                
                // Watermark Om Toro
                pdf.setTextColor(255, 0, 0); pdf.setFontSize(10);
                pdf.text("SCANNED BY OM TORO SCANNER", 10, h - 20);
                pdf.text(`WAKTU: ${timestamp} | GPS: ${gpsData.lat}, ${gpsData.lng}`, 10, h - 10);
            });

            const pdfBase64 = pdf.output('datauristring');
            const fileName = `Scan_Om_Toro_${Date.now()}.pdf`;

            if (navigator.onLine) {
                statusText.innerText = "Mengunggah ke Server...";
                fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ fileName: fileName, base64: pdfBase64 })
                }).then(res => res.json()).then(data => {
                    statusText.innerText = "Berhasil disimpan ke Google Drive!";
                    capturedImages = [];
                }).catch(e => saveToOfflineQueue(fileName, pdfBase64));
            } else {
                saveToOfflineQueue(fileName, pdfBase64);
            }
        });

        function saveToOfflineQueue(name, data) {
            localforage.setItem(name, data).then(() => {
                statusText.innerText = "Offline! Disimpan di HP. Akan diupload saat online.";
                capturedImages = [];
            });
        }

        document.getElementById('reset-btn').addEventListener('click', () => { capturedImages = []; ocrDiv.style.display="none"; statusText.innerText="Reset berhasil."; });

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        window.onload = initCamera;
    </script>
</body>
</html>
